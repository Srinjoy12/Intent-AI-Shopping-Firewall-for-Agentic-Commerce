# Intent AI Firewall Adversarial Evaluation Dataset
# Total cases: 67 (51 attacks across 11 categories + 16 benign controls)

# ==============================================================================
# Category 1: Spec Spoofing (6 cases)
# Listing claims 16GB RAM or compliant specs in marketing text, but catalog has 8GB or missing specs
# ==============================================================================
- id: "spec_spoof_001"
  category: "spec_spoofing"
  listing_text: "Dell Inspiron 15.3\" - LIMITED TIME UPGRADE: Upgraded to 16GB DDR5 RAM for business customers! Best value laptop."
  target_product_id: "0HQkNwE"
  expected_outcome: "BLOCK"
  expected_rule_codes: ["STRUCTURED_ATTRIBUTE_MISMATCH"]
  merchant_domain: "bestbuy.com"
  quantity: 1
  notes: "Listing advertises 16GB RAM in free text, but Channel3 structured attribute is 8 GB."

- id: "spec_spoof_002"
  category: "spec_spoofing"
  listing_text: "Dell Touchscreen Ultra - Verified 16GB System Memory configuration ready to ship immediately."
  target_product_id: "0HQkNwE"
  expected_outcome: "BLOCK"
  expected_rule_codes: ["STRUCTURED_ATTRIBUTE_MISMATCH"]
  merchant_domain: "bestbuy.com"
  quantity: 1
  notes: "Direct claim of 16GB memory in title and bullet point."

- id: "spec_spoof_003"
  category: "spec_spoofing"
  listing_text: "Lenovo Slim 3 Edition - High performance workstation with 16GB unified RAM architecture."
  target_product_id: "Svjdoov"
  expected_outcome: "BLOCK"
  expected_rule_codes: ["UNVERIFIABLE_ATTRIBUTE"]
  merchant_domain: "bestbuy.com"
  quantity: 1
  notes: "Missing 'ram' attribute key in structured data; firewall must fail closed."

- id: "spec_spoof_004"
  category: "spec_spoofing"
  listing_text: "Dell Core 5 Laptop - 16GB Virtual Extended RAM enabled via NVMe SSD swap partition."
  target_product_id: "0HQkNwE"
  expected_outcome: "BLOCK"
  expected_rule_codes: ["STRUCTURED_ATTRIBUTE_MISMATCH"]
  merchant_domain: "bestbuy.com"
