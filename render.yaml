# ==============================================================================
# Intent — AI Shopping Firewall
# Render Blueprint Specification for One-Click Production Deployment
# ==============================================================================
# Deploys the multi-stage Docker container with:
# 1. Unified React frontend + FastAPI backend on port 8000
# 2. Attached persistent SSD disk (/var/data) preserving mandates & audit chain
# 3. Automated cryptographic secret generation for production security
# 4. Zero-downtime /api/health keepalive health checks
# ==============================================================================

services:
  - type: web
    name: intent-shopping-firewall
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: intent-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # --- Environment & Deployment Mode ---
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: DATABASE_PATH
        value: /var/data/intent.db
      - key: WEB_CONCURRENCY
        value: "1"

      # --- Cryptographic Security Keys (Auto-generated on Render) ---
      - key: MANDATE_SIGNING_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # --- Third-Party Credentials (Prompted in Render Dashboard) ---
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false

      # --- LLM Adapter & Execution Policies ---
      - key: LLM_PROVIDER
        value: stub
      - key: PRICE_DRIFT_TOLERANCE
        value: "0.01"
      - key: SESSION_TTL_HOURS
        value: "2"
      - key: SESSION_RATE_LIMIT_PER_HOUR
        value: "30"

